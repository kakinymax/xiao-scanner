<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="XIAO温度計のWebスキャナーは提供を終了しました。温湿度と履歴は本体で、通知はDiscordで確認できます。">
  <title>スキャナー終了のお知らせ | XIAO温度計</title>
  <style>
    :root { color-scheme: light; --ink: #20362d; --muted: #53635a; --line: #d8e1d9; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6f1; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.8; }
    main { width: min(100% - 40px, 680px); margin: clamp(40px, 10vh, 100px) auto; }
    .project { margin: 0 0 20px; color: var(--muted); font-size: 14px; letter-spacing: .08em; }
    h1 { margin: 0 0 24px; font-size: clamp(28px, 6vw, 40px); line-height: 1.5; font-weight: 700; letter-spacing: .02em; }
    .intro { margin: 0 0 28px; font-size: 17px; }
    dl { margin: 0 0 32px; padding: 6px 24px; background: #fff; border: 1px solid var(--line); border-radius: 16px; }
    dl > div { display: grid; grid-template-columns: 9em 1fr; gap: 12px; padding: 16px 0; }
    dl > div + div { border-top: 1px solid var(--line); }
    dt { font-weight: 600; }
    dd { margin: 0; color: var(--muted); }
    .guide { display: inline-block; padding: 12px 24px; border-radius: 8px; background: #245c45; color: #fff; text-decoration: none; font-weight: 600; }
    .guide:hover { background: #184631; }
    .guide:focus-visible { outline: 3px solid #739b44; outline-offset: 4px; }
    .note { margin: 28px 0 0; padding-top: 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
    @media (max-width: 480px) {
      dl { padding: 6px 18px; }
      dl > div { grid-template-columns: 1fr; gap: 2px; }
      .intro { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="project">XIAO 温度計プロジェクト</p>
    <h1>スキャナーの提供を<br>終了しました</h1>
    <p class="intro">温度計はWi-Fiで通知する方式へ移行しました。<br>温度・湿度と履歴は本体の画面で確認できます。</p>
    <dl>
      <div><dt>温度・湿度</dt><dd>温度計本体に表示</dd></div>
      <div><dt>履歴グラフ</dt><dd>本体で6・12・24時間を切り替え</dd></div>
      <div><dt>定期・イベント通知</dt><dd>Wi-Fi経由でDiscordへ送信</dd></div>
    </dl>
    <a class="guide" href="https://github.com/kakinymax/xiao-scanner/blob/main/docs/WIFI_DISCORD.md">新しい温度計の使い方を見る</a>
    <p class="note">このページでのQR読み取りとBluetooth接続は終了しました。</p>
  </main>
</body>
</html>
